<!doctype html>
<!--
  MSI Thin Board - Lively Wallpaper
  Files:  css/style.css   styling
          vendor/         three.js (3D library, do not edit)
          js/config.js    ** settings you can edit by hand **
          js/             the app (see README.md for a map)
          helper/         background helper that feeds real CPU/GPU/battery/music/repo data into data/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSI Thin Board</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="stage"></div>   <!-- the 3D canvas goes here -->
<div id="stat"></div>    <!-- small readout at the bottom right -->

<!-- Bar: [●] widgets | colour dots | [CPU] board  [</>] code  [GitHub] repos -->
<div id="ui">
  <div class="grp" id="sc"></div>
  <span class="sep"></span>
  <div class="grp" id="pal"></div>
  <span class="sep"></span>
  <div class="grp" id="lnk">
    <button id="bBoard" title="Board scene"><svg class="st" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></button>
    <button id="bCode" title="Code scene"><svg class="st" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></button>
    <button id="bRepo" title="Repos scene"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></button>
  </div>
</div>

<!-- Widgets (js/widgets.js) -->
<div id="wg">

  <!-- 1. Music -->
  <div class="wt" id="wMusic" style="--i:0">
    <h6><span>Music</span><span class="eq"><i></i><i></i><i></i><i></i></span></h6>
    <div class="mwrap">
      <div id="mArt"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
      <div id="mCtl">
        <button id="mPrev" class="cbtn" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
        <button id="mPlay" class="cbtn pp" title="Play / Pause">
          <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg>
        </button>
        <button id="mNext" class="cbtn" title="Next"><svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5v14l10.5-7z"/></svg></button>
      </div>
    </div>
    <div id="mTitle">Nothing playing</div>
    <div id="mArtist">Play something</div>
  </div>

  <!-- 2. Focus timer: click the time to start / pause, double-click to reset -->
  <div class="wt" id="wPomo" style="--i:1">
    <h6><span>Focus</span><span><b id="pState">TAP TO START</b></span></h6>
    <div id="pTime" title="Click: start / pause - Double-click: reset">25:00</div>
    <div class="pbar"><i id="pBar"></i></div>
    <div class="pbtns">
      <button id="pMinus" class="cbtn pp" title="-5 min"><svg class="st" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="pPlus" class="cbtn pp" title="+5 min"><svg class="st" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>

  <!-- 3. System: battery icon and RAM stick (segments are generated by js: one per GB) -->
  <div class="wt" id="wSys" style="--i:2">
    <h6><span>System</span><span id="sPow"></span></h6>
    <div class="rings">
      <div class="ic" id="icBat">
        <svg viewBox="0 0 60 100">
          <rect class="bo" x="8" y="12" width="44" height="86" rx="9"/>
          <rect class="bn" x="22" y="4" width="16" height="9" rx="3"/>
          <rect id="bFill" x="13" y="17" width="34" height="76" rx="5"/>
          <path id="bBolt" d="M34 34 L21 59 H30 L26 80 L40 53 H31 Z"/>
        </svg>
        <strong id="vBat">--</strong><em>BATTERY</em>
      </div>
      <div class="ic">
        <svg viewBox="0 0 60 100">
          <rect class="bo" x="8" y="6" width="44" height="82" rx="6"/>
          <g id="ramSegs"></g>
          <g class="pins"><rect x="12" y="91" width="4" height="6"/><rect x="18" y="91" width="4" height="6"/><rect x="24" y="91" width="4" height="6"/><rect x="32" y="91" width="4" height="6"/><rect x="38" y="91" width="4" height="6"/><rect x="44" y="91" width="4" height="6"/></g>
        </svg>
        <strong id="vRam">--</strong><em id="eRam">RAM</em>
      </div>
    </div>
    <div class="cap" id="sCap">waiting for helper&hellip;</div>
  </div>

  <!-- 4. Network and disk -->
  <div class="wt" id="wNet" style="--i:3">
    <h6><span>Network</span><span id="nDisk"></span></h6>
    <div class="spd">
      <div><small>&#9660; DOWN</small><span id="nDn">--</span></div>
      <div style="text-align:right"><small>&#9650; UP</small><span id="nUp">--</span></div>
    </div>
    <svg id="nSpark" viewBox="0 0 100 30" preserveAspectRatio="none"><path class="a" d=""/><path class="l" d=""/></svg>
    <div class="dbar"><i id="dBar"></i></div>
    <div class="cap" id="dCap">--</div>
  </div>
</div>

<!-- Scripts: plain files sharing one global scope, so ORDER MATTERS - each file may use what the ones above define.
     See README.md for what each file does. -->
<script src="vendor/three.min.js"></script>        <!-- three.js 3D library (r128, third party) -->
<script src="vendor/three-addons.js"></script>     <!-- its post-processing passes: bloom etc. (third party) -->

<script src="js/config.js"></script>               <!-- settings you can edit: colours, quality levels, frame rates -->
<script src="js/state.js"></script>                <!-- shared state: URL options, saved choices, LOAD numbers -->
<script src="js/renderer.js"></script>             <!-- WebGL renderer, camera, post-processing, shared helpers -->
<script src="js/feeds.js"></script>                <!-- live data: reads data/*.js written by the helper -->
<script src="js/scenes/board.js"></script>         <!-- scene 0: laptop motherboard -->
<script src="js/scenes/repos.js"></script>         <!-- scene 1: GitHub repos graph -->
<script src="js/scenes/code.js"></script>          <!-- scene 2: flying code windows -->
<script src="js/ui/hover.js"></script>             <!-- hover labels over the board's chips -->
<script src="js/perf.js"></script>                 <!-- quality level / frame-rate control -->
<script src="js/scenes/manager.js"></script>       <!-- which scene is shown, fades, colour themes -->
<script src="js/ui/controls.js"></script>          <!-- bar, keyboard, resize, Lively settings -->
<script src="js/main.js"></script>                 <!-- start-up + frame loop -->
<script src="js/ui/widgets.js"></script>           <!-- the four widget tiles -->

</body>
</html>
